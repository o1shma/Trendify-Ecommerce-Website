<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="assets/images/logo.png" alt="Trendify" height="40">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        <li class="nav-item">
  <a class="nav-link position-relative" href="cart.html">
    Cart <span id="cartCount" class="badge bg-primary rounded-pill">0</span>
  </a>
</li>
		</ul>
      </div>
    </div>
  </nav>
  <div class="container py-5">
    <h1>Contact Us</h1>
    <p class="lead">We’d love to hear from you! Fill out the form below or reach out through email.</p>

    <form id="contactForm" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Your Name</label>
        <input type="text" id="name" class="form-control" required>
        <div class="invalid-feedback">Please enter your name.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" required>
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" class="form-control" rows="5" required></textarea>
        <div class="invalid-feedback">Please enter your message.</div>
      </div>
      <button class="btn btn-primary" type="submit">Send Message</button>
    </form>
  </div>

  <!-- Reuse footer -->
  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <p class="mb-2">
        <a href="about.html" class="footer-link">About Us</a> |
        <a href="contact.html" class="footer-link">Contact Us</a> |
        <a href="privacy.html" class="footer-link">Privacy Policy</a> |
        <a href="terms.html" class="footer-link">Terms & Conditions</a>
      </p>
      <p class="mb-0">&copy; <span id="year"></span> Trendify</p>
    </div>
  </footer>

  <script src="js/scripts.js"></script>
</body>
</html>
